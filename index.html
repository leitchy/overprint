<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Overprint — Orienteering Course Setting</title>
    <meta name="description" content="Web-based orienteering course setting software. Design courses, export PDFs, manage events — all in your browser." />
    <meta name="theme-color" content="#C850A0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- No-flash theme: resolve + apply before first paint. Kept in sync with
         LOCAL_STORAGE_KEY_THEME in src/stores/app-settings-store.ts (a unit test
         asserts this key string is present here). -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('overprint-theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          root.setAttribute('data-theme', dark ? 'dark' : 'light');
          root.style.colorScheme = dark ? 'dark' : 'light';
          // Must match --c-canvas-surround (dark/light) in src/index.css.
          root.style.backgroundColor = dark ? '#101217' : '#f3f4f6';
        } catch (e) {}
      })();
    </script>

    <!-- iOS home-screen / standalone PWA (iOS ignores the web manifest) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Overprint" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Open Graph -->
    <meta property="og:title" content="Overprint — Orienteering Course Setting" />
    <meta property="og:description" content="Web-based orienteering course setting software. Design courses, export PDFs, manage events — all in your browser." />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Overprint — Orienteering Course Setting" />
    <meta name="twitter:description" content="Web-based orienteering course setting software. Works on any device." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
